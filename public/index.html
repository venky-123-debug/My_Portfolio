<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Venkatesh C</title>
    <link rel="icon" type="image/png" href="user.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap" rel="stylesheet">

    <style>
      /* width */
      ::-webkit-scrollbar {
      width: 5px;
      height: 2px;
      }
      /* Track */
      ::-webkit-scrollbar-track {
      background: transparent;
      }
      /* Handle */
      ::-webkit-scrollbar-thumb {
      background: var(--color);
      border-radius: 8px;
      }
      /* Handle on hover */
      ::-webkit-scrollbar-thumb:hover {
      background: #707175;
      }
      /* @import url("https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;0,1000;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900;1,1000&display=swap"); */
      @font-face {
      font-family: "Nunito";
      font-style: normal;
      src: url(assets/font/Nunito-Regular.woff) format("woff");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
      font-family: "aldrich";
      src: url(assets/font/Aldrich-Regular.ttf);
      }
      body {
      margin: 0;
      color: var(--mainColor);
      position: relative;
      overflow: hidden;
      overflow-y: scroll;
      background-color: #171717;
      color: var(--mainColor);
      }
      :root {
      --color: #00909e;
      --mainColor: whitesmoke;
      --venkateshColor: white; /* Venkatesh's shadow color */
      }
      #mainLoader {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      z-index: 100;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #202020;
      color: whitesmoke;
      font-size: 70px;
      width: 100%;
      transition: 1s;
      top: 0px;
      left: 0px;
      opacity: 1;
      }
      #mainLoader.active {
      transform: translate(0px, -100%);
      /* opacity: 0; */
      }
      #mainLoader {
      font-size: 60px;
      }
      .color {
      color: var(--color);
      transition: 0.5s ease;      
      }  
      .venkatesh-shadow {
    text-shadow: 5px 5px var(--venkateshColor); /* Shadow for "Venkatesh" using Chandran color */
  }

  .chandran-shadow {
    text-shadow: 5px 5px var(--color); /* Shadow for "Chandran" using Venkatesh color */
  }
    
    </style>
  </head>
  <body>
    <div id="mainLoader">
      Venkatesh<span class="color">Chandran</span></i>
      <!-- <span class="chandran-shadow">Venkatesh</span>
      <span class="venkatesh-shadow color">Chandran</span> -->
     
    </div>
    <div id="mainContent" style="display: none"></div>
    <!-- <link rel="stylesheet" href="https://kit.fontawesome.com/26b3d632d0.css" crossorigin="anonymous" /> -->
    <script src="https://kit.fontawesome.com/eafe3e794a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="build/bundle.css" />
    <script defer src="build/bundle.js"></script>
  </body>
</html>
